name: 'Build hwchoc nice_nano_v2'
on:
  push:
    branches:
      - '**'
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["hwchoc_left","hwchoc_right"]'
      alphas: '["QWERTY"]'
      nav: '["vi"]'
      kconfig: '["CONFIG_ZMK_MOUSE=y"]'
      branches: '["evgnskv/miryoku_zmk/hwchoc-custom-layers"]'
